name: CIS Benchmark Conversion

on:
  push:
    branches: ["**"]
    paths:
      - "reference/Documentation-main/endpoint-hardening/benchmarks/**/*.pdf"
      - "reference/Documentation-main/endpoint-hardening/scripts/cis_benchmark_converter.py"
      - "reference/Documentation-main/endpoint-hardening/scripts/cis_batch_runner.py"
      - "reference/Documentation-main/endpoint-hardening/scripts/requirements.txt"
  workflow_dispatch:
    inputs:
      output_format:
        description: "Output format"
        required: false
        default: "excel"
        type: choice
        options:
          - excel
          - csv
          - json
      start_page:
        description: "Start page for extraction (skip front matter)"
        required: false
        default: "10"
        type: string

permissions:
  contents: write

concurrency:
  group: cis-benchmark-conversion
  cancel-in-progress: true

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "reference/Documentation-main/endpoint-hardening/scripts/requirements.txt"

      - name: Install dependencies
        run: |
          pip install -r reference/Documentation-main/endpoint-hardening/scripts/requirements.txt

      - name: Run CIS benchmark batch conversion
        id: conversion
        continue-on-error: true
        run: |
          python reference/Documentation-main/endpoint-hardening/scripts/cis_batch_runner.py \
            --input-dir reference/Documentation-main/endpoint-hardening/benchmarks \
            --output-dir reference/Documentation-main/endpoint-hardening/scripts/outputs \
            --format "${{ inputs.output_format || 'excel' }}" \
            --start-page "${{ inputs.start_page || '10' }}" \
            --log-level INFO

      - name: Post run report to job summary
        if: always()
        run: |
          REPORT="reference/Documentation-main/endpoint-hardening/scripts/outputs/run_report.md"
          if [ -f "$REPORT" ]; then
            cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No run report generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload outputs as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cis-conversion-outputs-${{ github.run_number }}
          path: reference/Documentation-main/endpoint-hardening/scripts/outputs/
          if-no-files-found: ignore
          retention-days: 30

      - name: Commit conversion outputs back to repository
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reference/Documentation-main/endpoint-hardening/scripts/outputs/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update CIS benchmark conversion outputs [skip ci]"
            git push
          fi

      - name: Fail job if any conversions failed
        if: steps.conversion.outcome == 'failure'
        run: |
          echo "One or more PDF conversions failed. Check the run report above for details."
          exit 1
